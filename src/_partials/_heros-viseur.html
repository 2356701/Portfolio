<section class="heros-viseur" data-fond="sombre">
    <div class="wrapper">
        <a href="index.html#projets" class="bouton bouton_inverse heros-viseur_retour">
            <span class="bouton_icone bouton_icone-retour" aria-hidden="true"></span>
            Tous les projets
        </a>

        <div class="heros-viseur_cadre">
            <div class="heros-viseur_coins" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p class="heros-viseur_rec" aria-hidden="true">Rec</p>

            <div class="heros-viseur_texte">
                <p class="heros-viseur_type">{{ projet.type }}</p>
                <h1 class="heros-viseur_titre">{{ projet.titre }}</h1>
                <p class="heros-viseur_description">{{ projet.description }}</p>

                <ul class="heros-viseur_roles">
                    {% for role in projet.roles %}
                    <li>{{ role }}</li>
                    {% endfor %}
                </ul>

                <p class="heros-viseur_ia">{{ projet.ia }}</p>
            </div>

            <div class="heros-viseur_media">
                <img src="{{ projet.image }}" alt="{{ projet.imageAlt }}" />
                <p class="heros-viseur_timecode" aria-hidden="true">00:00:00:00</p>
            </div>

            <ul class="heros-viseur_outils">
                {% for outil in projet.outils %}
                <li>
                    <a href="{{ outil.lien }}" target="_blank" rel="noopener" aria-label="{{ outil.nom }}">
                        <img src="{{ outil.logo }}" alt="" />
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</section>
