<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{title}} · Nathan Fortier</title>
        <meta
            name="description"
            content="Portfolio de Nathan Fortier — création média : vidéo, son et motion."
        />

        <link rel="stylesheet" href="styles/main.css" />

        <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg" />
        <link rel="apple-touch-icon" href="assets/favicons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="The_Nat" />

        <script src="scripts/main.js" defer></script>
    </head>
    <body data-component="Scrolly">
        <header class="entete" data-component="Header">
            <div class="conteneur entete_barre">
                <a href="index.html" class="entete_bulle entete_logo">
                    <span class="entete_logo-texte">The_<wbr />Nat</span>
                </a>

                <nav class="entete_bulle entete_nav" aria-label="Navigation principale">
                    <span class="entete_indicateur" aria-hidden="true"></span>

                    <ul class="entete_liens">
                        <li>
                            <a
                                href="index.html#apropos"
                                class="entete_lien {% if activePage == 'apropos' %}actif{% endif %}"
                                >À propos</a
                            >
                        </li>
                        <li class="entete_separateur" aria-hidden="true"></li>
                        <li>
                            <a href="index.html#projets" class="entete_lien">Projets</a>
                        </li>
                        <li class="entete_separateur" aria-hidden="true"></li>
                        <li>
                            <a href="index.html#contact" class="entete_lien">Contact</a>
                        </li>
                    </ul>
                </nav>

                <div class="entete_bulle entete_reseaux" data-reseaux>
                    <button
                        class="entete_reseaux-bouton"
                        type="button"
                        aria-expanded="false"
                        aria-controls="entete-reseaux-liste"
                        aria-label="Afficher mes réseaux sociaux"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            width="24"
                            height="24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                            focusable="false"
                        >
                            <circle cx="18" cy="5" r="3" />
                            <circle cx="6" cy="12" r="3" />
                            <circle cx="18" cy="19" r="3" />
                            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5" />
                            <line x1="15.4" y1="6.5" x2="8.6" y2="10.5" />
                        </svg>
                    </button>

                    <div class="entete_reseaux-contenu">
                        {% include "_reseaux.html" with {classe: "entete_reseaux-liste", id: "entete-reseaux-liste"} %}
                    </div>
                </div>

                <button
                    class="entete_bouton-menu js-toggle"
                    type="button"
                    aria-label="Ouvrir le menu"
                    aria-expanded="false"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>
